name: "Release"

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--bundles app,dmg --target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: "--bundles deb,rpm"
          - platform: windows-latest
            args: "--bundles nsis,msi"
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build and create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "DeltaDevX v__VERSION__"
          releaseBody: "Offline developer utilities."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # ── Free ad-hoc signing for macOS (no Apple account required) ──────────
      # signingIdentity "-" in tauri.conf.json handles this at build time,
      # but this step deep-re-signs to catch any unsigned nested binaries.
      - name: Ad-hoc sign macOS app (free, no Apple account needed)
        if: matrix.platform == 'macos-latest'
        run: |
          APP=$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -name "*.app" | head -1)
          if [ -n "$APP" ]; then
            echo "Ad-hoc signing: $APP"
            codesign --force --deep --sign - "$APP"
            echo "✅ Ad-hoc signed successfully"
          else
            echo "⚠️  No .app found to sign — skipping"
          fi
